name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: ./install-deps.sh
      - run: forge build
      - run: forge test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bun test tests

  # Installs with npm, exactly as a new contributor would. The bun job above does not
  # notice peer-dependency conflicts that make `npm install` fail.
  frontend-npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: oven-sh/setup-bun@v2
      - run: ./install-deps.sh && forge build
        working-directory: contracts
      - run: bun install
        working-directory: agents
      - run: bunx tsc --noEmit
        working-directory: agents
      - run: bun test tests
        working-directory: agents
      - run: bun run demo:local
        working-directory: agents
      - run: bun install
        working-directory: frontend
      - run: bun run test:calls
        working-directory: frontend
